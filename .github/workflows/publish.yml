name: Publish
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/test.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts
      - run: npm publish artifacts/darwin-arm64/native.tgz --access public --provenance --registry https://registry.npmjs.org --ignore-scripts
      - run: npm publish artifacts/linux-x64-gnu/native.tgz --access public --provenance --registry https://registry.npmjs.org --ignore-scripts
      - run: npm publish artifacts/darwin-arm64/entry.tgz --access public --provenance --registry https://registry.npmjs.org --ignore-scripts
