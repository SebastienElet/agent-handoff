name: Agent Handoff tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            variant: darwin-arm64
          - os: ubuntu-24.04
            variant: linux-x64-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: rustup show active-toolchain
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -Dwarnings
      - run: cargo build --release --locked
      - run: bun run package:native
      - run: bun run test
      - run: bun run typecheck
      - run: mkdir dist
      - run: bun pm pack --filename dist/entry.tgz
      - run: bun pm pack --filename "$GITHUB_WORKSPACE/dist/native.tgz"
        working-directory: packages/agent-handoff-${{ matrix.variant }}
      - run: bun test tests/package.test.ts
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.variant }}
          path: dist/*.tgz
          if-no-files-found: error
